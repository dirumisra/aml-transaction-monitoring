# ----------------------------------------
# UAT CI Pipeline — AML Transaction Monitoring
# ----------------------------------------
# This workflow runs automated checks whenever:
# - Code is pushed to uat branch
# ----------------------------------------

name: AML UAT Pipeline

on:
  push:
    branches: [uat]

permissions:
  contents: write

jobs:
  uat_validation:
    runs-on: ubuntu-latest

    steps:

    # ----------------------------
    # Step 1: Checkout repository
    # ----------------------------
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    # ----------------------------
    # Step 2: Setup Python
    # ----------------------------
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # ----------------------------
    # Step 3: Install dependencies
    # ----------------------------
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyarrow scikit-learn imbalanced-learn xgboost shap mlflow groq python-dotenv

    # ----------------------------
    # Step 4: Validate project structure
    # ----------------------------
    - name: Verify project structure
      run: |
        echo "Checking project structure..."
        ls -la
        echo "Checking src folder..."
        ls -la src/

    # ----------------------------
    # Step 5: Syntax check (Pipeline + Models + GenAI)
    # ----------------------------
    - name: Syntax check — all scripts
      run: |
        python -m py_compile src/ingestion/bronze_aml_ingest.py
        python -m py_compile src/features/silver_aml_transform.py
        python -m py_compile src/features/gold_feature_engineering.py
        python -m py_compile src/models/model_logistic_regression.py
        python -m py_compile src/models/model_random_forest.py
        python -m py_compile src/models/model_xgboost.py
        python -m py_compile src/dq/dq_aml_validation.py
        python -m py_compile src/evaluation/model_shap_explainability.py
        python -m py_compile src/genai/sar_report_generator.py
        echo "All scripts passed syntax check ✅"

    # ----------------------------
    # Step 6: Auto merge to MAIN
    # ----------------------------
    - name: Auto merge UAT to MAIN
      if: success()
      run: |
        echo "Starting merge from UAT → MAIN..."

        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"

        # Fetch latest branches
        git fetch origin

        # Checkout main branch
        git checkout main

        # Pull latest changes from main (CRITICAL FIX)
        git pull origin main

        # Merge UAT into MAIN (fail if conflict)
        git merge origin/uat --no-edit || exit 1

        # Push to MAIN
        git push origin main

        echo "UAT successfully merged into MAIN ✅"