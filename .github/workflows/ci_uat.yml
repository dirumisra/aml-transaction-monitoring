# ----------------------------------------
# UAT CI Pipeline — AML Transaction Monitoring
# ----------------------------------------
# Triggers when code is pushed to UAT branch
# Runs DQ validation and model training checks
# ----------------------------------------
name: AML UAT Pipeline

on:
  push:
    branches: [uat]
  pull_request:
    branches: [uat]

jobs:
  uat_validation:
    runs-on: ubuntu-latest

    steps:

    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Setup Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyarrow scikit-learn imbalanced-learn xgboost shap mlflow groq python-dotenv

    # Step 4: Syntax check all scripts
    - name: Syntax check — all scripts
      run: |
        python -m py_compile src/ingestion/bronze_aml_ingest.py
        python -m py_compile src/features/silver_aml_transform.py
        python -m py_compile src/features/gold_feature_engineering.py
        python -m py_compile src/models/model_logistic_regression.py
        python -m py_compile src/models/model_random_forest.py
        python -m py_compile src/models/model_xgboost.py
        python -m py_compile src/dq/dq_aml_validation.py
        python -m py_compile src/evaluation/model_shap_explainability.py
        python -m py_compile src/genai/sar_report_generator.py
        echo "All scripts passed syntax check ✅"

    # Step 5: Verify folder structure
    - name: Verify folder structure
      run: |
        echo "Verifying enterprise folder structure..."
        ls -la src/
        ls -la src/models/
        ls -la src/features/
        ls -la src/ingestion/
        ls -la src/genai/
        ls -la src/evaluation/
        echo "Folder structure verified ✅"